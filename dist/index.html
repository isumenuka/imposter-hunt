<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Imposter Hunt</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="A thrilling multiplayer party game where you hunt the imposter!" />
  <link rel="manifest" href="/manifest.json" />

  <!-- iOS Specific PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Imposter Hunt" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'blob': 'blob 7s infinite',
            'scan': 'scan 2s linear infinite',
          },
          keyframes: {
            blob: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
              '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
              '100%': { transform: 'translate(0px, 0px) scale(1)' },
            },
            scan: {
              '0%': { top: '0%', opacity: '0' },
              '10%': { opacity: '1' },
              '90%': { opacity: '1' },
              '100%': { top: '100%', opacity: '0' },
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --glass-bg: rgba(30, 41, 59, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-pink: #ec4899;
    }

    * {
      -webkit-tap-highlight-color: rgba(147, 51, 234, 0.15);
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior: none;
      background: var(--bg-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: pan-x pan-y;
      font-size: 14px;
    }

    /* Prevent zoom on input focus (mobile) */
    input,
    select,
    textarea {
      font-size: 14px !important;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 10, 0.5);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(100, 100, 100, 0.3);
      border-radius: 3px;
      transition: background 0.2s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 100, 100, 0.5);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 8px 24px -4px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Enhanced animations */
    @keyframes shimmer {
      0% {
        background-position: -1000px 0;
      }

      100% {
        background-position: 1000px 0;
      }
    }

    .animation-delay-2000 {
      animation-delay: 2s;
    }

    .animation-delay-4000 {
      animation-delay: 4s;
    }

    /* PWA Install Prompt */
    .install-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    /* Animated Star Background */
    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.2;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-20px);
      }
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite, float 6s ease-in-out infinite;
    }

    .star:nth-child(1) {
      width: 2px;
      height: 2px;
      top: 20%;
      left: 10%;
      animation-delay: 0s, 0s;
    }

    .star:nth-child(2) {
      width: 1px;
      height: 1px;
      top: 40%;
      left: 25%;
      animation-delay: 0.5s, 1s;
    }

    .star:nth-child(3) {
      width: 2px;
      height: 2px;
      top: 60%;
      left: 15%;
      animation-delay: 1s, 2s;
    }

    .star:nth-child(4) {
      width: 1px;
      height: 1px;
      top: 80%;
      left: 30%;
      animation-delay: 1.5s, 3s;
    }

    .star:nth-child(5) {
      width: 2px;
      height: 2px;
      top: 15%;
      left: 70%;
      animation-delay: 2s, 1.5s;
    }

    .star:nth-child(6) {
      width: 1px;
      height: 1px;
      top: 35%;
      left: 85%;
      animation-delay: 2.5s, 2.5s;
    }

    .star:nth-child(7) {
      width: 2px;
      height: 2px;
      top: 55%;
      left: 75%;
      animation-delay: 3s, 0.5s;
    }

    .star:nth-child(8) {
      width: 1px;
      height: 1px;
      top: 75%;
      left: 90%;
      animation-delay: 3.5s, 4s;
    }

    .star:nth-child(9) {
      width: 1px;
      height: 1px;
      top: 25%;
      left: 50%;
      animation-delay: 0.8s, 3.5s;
    }

    .star:nth-child(10) {
      width: 2px;
      height: 2px;
      top: 45%;
      left: 45%;
      animation-delay: 1.2s, 1.8s;
    }

    .star:nth-child(11) {
      width: 1px;
      height: 1px;
      top: 65%;
      left: 55%;
      animation-delay: 1.8s, 2.2s;
    }

    .star:nth-child(12) {
      width: 2px;
      height: 2px;
      top: 85%;
      left: 60%;
      animation-delay: 2.2s, 4.5s;
    }
  </style>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered:', registration);
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
    }
